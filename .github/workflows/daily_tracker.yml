name: Daily Price Tracker

on:
  schedule:
    # 04:37 UTC — asymmetric minute to avoid GitHub Actions queue peaks
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-flight runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  track-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        run: python tracker.py

      - name: Commit updated price history
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always update last_run.txt — keeps the repo active so GitHub
          # never pauses the cron schedule after 60 days of inactivity.
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > last_run.txt

          git add price_history.json last_run.txt

          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update price history $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the repo root — index.html + price_history.json served as static files
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
